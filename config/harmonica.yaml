# Harmonica (Ou et al., arXiv:2609.04640): instrument-agnostic transcription
# with multi-depth harmonic convolution. Every number below is the paper's
# unless its comment says otherwise. `--size nano|small|medium|large|x-large`
# picks a row of Table 1, and renames the run with it.
name: harmonica-${model.size}

data:
  # Where each corpus lives; null leaves it out.
  sources:
    # MAESTRO v3, extracted: <root>/maestro-v3.0.0.json and the year folders.
    maestro: data/maestro-v3.0.0
    # MAPS: <root>/Source/MAPS_ENSTDk*.zip.
    maps: data/MAPS
    # GuitarSet from Zenodo 3371780: annotation.zip, audio_mono-mic.zip,
    # audio_mono-pickup_mix.zip.
    guitarset: data/GuitarSet
    # GAPS v1.1 from Hugging Face (xavriley/GAPS), audio included.
    gaps: data/GAPS
    # EGDB from the authors' Google Drive; six tones, clips 216-240 test.
    egdb: data/EGDB
    # GOAT, by request from Zenodo 15690894: <root>/metadata.csv and data/.
    goat: data/GOAT
    # URMP: <root>/Dataset/<NN>_<piece>/.
    urmp: data/URMP
    # Slakh2100 in its original layout (train/, validation/, test/); the tracks
    # redux omits are skipped.
    slakh: data/slakh2100_flac
  # Manifest, note arrays, and 16 kHz mono audio (~42 GB with cache_audio).
  cache_dir: data/cache
  # Not in the paper: copy every recording not already 16 kHz mono into the
  # cache as 16 kHz FLAC. A random 5 s read from 44.1 kHz FLAC or network
  # storage takes tens of milliseconds, enough to starve the GPU.
  cache_audio: true
  # MAESTRO's notes are held while the pedal is (not stated in the paper; the
  # usual practice since Onsets and Frames). MAPS's text annotations already are.
  sustain_pedal: true
  # Source i drawn with probability proportional to (hours_i / total)^alpha.
  temperature: 0.5
  clip_seconds: 5.0
  # Held out of the training splits by the same sampling (Table 3: 4.3 h).
  dev_hours: 4.33
  dev_seed: 1234
  num_workers: 16

model:
  size: medium
  # Null takes the size's (c2, l) from Section 4.1; c1 is c2 / 4.
  channels: null
  layers: null
  frontend_channels: null
  cqt:
    sample_rate: 16000
    # 32 ms frames.
    hop_length: 512
    bins_per_semitone: 3
  harmonic:
    # shift_aggregate (the paper's), hdconv (HPPNet's), stacking (Basic
    # Pitch's, at the input), or none: Table 2's rows.
    kind: shift_aggregate
    # multi: a harmonic layer in every trunk block; single: in the first only.
    depth: multi
    # Harmonics 1..8 and subharmonics 2..8: the paper's "7 and 7".
    harmonics: 8
  head:
    # Not in the paper, which cites HPPNet: HPPNet's bidirectional LSTM.
    # Width per direction; null is half the trunk's (the whole trunk's
    # when unidirectional).
    hidden_size: null
    bidirectional: true
    # Not in the paper: a fourth head, each onset's MIDI velocity.
    velocity: false
    # Scales the velocity BCE in the summed loss (detection heads stay at 1).
    velocity_weight: 0.01

training:
  output_dir: outputs
  seed: 1234
  accelerator: auto
  devices: 1
  strategy: auto
  precision: bf16-mixed
  # Not in the paper: torch.compile the model, which only changes speed.
  compile: true
  batch_size: 8
  max_steps: 100_000
  learning_rate: 2e-4
  min_learning_rate: 0.0
  warmup_steps: 0
  # Not in the paper: AdamW's PyTorch default.
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  grad_clip: null
  log_freq: 50
  # Dev-set transcription at fixed thresholds; the sweep is evaluation's.
  val_freq: 10000
  val_onset_threshold: 0.5
  val_frame_threshold: 0.5
  save_freq: 10000

evaluation:
  output_dir: outputs/evaluations
  test_sets: [maestro, maps, guitarset, gaps, egdb, goat, urmp, slakh]
  # Appendix D: 5 s chunks overlapping by half, the middle half of each kept.
  chunk_seconds: 5.0
  batch_size: 32
  # Appendix D: onset, then frame, each over [0.1, 0.85] by 0.05.
  threshold_grid:
    start: 0.1
    stop: 0.85
    step: 0.05
  # Frame F1 from decoded notes at 25 ms, the same for every model.
  frame_seconds: 0.025
  onset_tolerance: 0.05
  offset_ratio: 0.2
  offset_min_tolerance: 0.05
  max_recordings: null
  write_midi: false
  accelerator: auto
  # GPUs transcribing at once: a count, or all.
  devices: 1

wandb:
  project: harmonica
  name: null
  mode: online
